name: BatteryMonitor
options:
  bundleIdPrefix: com.batterymonitor
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

targets:
  BatteryMonitorShared:
    type: framework
    platform: macOS
    sources:
      - path: Sources/BatteryMonitorShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swacktools.batterymonitor.shared
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: YES

  BatteryMonitorPrivilegedHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/BatteryMonitorPrivilegedHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swacktools.batterymonitor.helper
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WHS8S6ZW43
    dependencies:
      - target: BatteryMonitorShared

  BatteryMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources/BatteryMonitor
      - path: SupportFiles/Assets.xcassets
        buildPhase: resources
    info:
      path: SupportFiles/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSUIElement: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: SupportFiles/BatteryMonitor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swacktools.batterymonitor
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WHS8S6ZW43
        OTHER_SWIFT_FLAGS: "-parse-as-library"
        INFOPLIST_FILE: SupportFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportFiles/BatteryMonitor.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BatteryMonitorShared
      - target: BatteryMonitorPrivilegedHelper
      - sdk: ServiceManagement.framework
    postBuildScripts:
      - name: Bundle Privileged Helper
        script: |
          set -euo pipefail
          app_contents="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          mkdir -p "$app_contents/MacOS" "$app_contents/Library/LaunchDaemons"
          cp "$BUILT_PRODUCTS_DIR/BatteryMonitorPrivilegedHelper" "$app_contents/MacOS/BatteryMonitorPrivilegedHelper"
          cp "$SRCROOT/SupportFiles/LaunchDaemons/com.swacktools.batterymonitor.helper.plist" \
            "$app_contents/Library/LaunchDaemons/com.swacktools.batterymonitor.helper.plist"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/BatteryMonitorPrivilegedHelper
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/com.swacktools.batterymonitor.helper.plist
