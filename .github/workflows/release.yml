name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build or update, for example v1.1.0'
        required: true
        default: 'v1.1.0'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [[ -d /Applications/Xcode.app ]]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Import Developer ID certificate
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12

          security import certificate.p12 \
            -k build.keychain \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign

          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12

      - name: Build release binaries
        run: |
          swift build -c release --product BatteryMonitor
          swift build -c release --product BatteryMonitorPrivilegedHelper
          echo "bin_path=$(swift build -c release --show-bin-path)" >> "$GITHUB_ENV"

      - name: Get version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v(.*)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
              echo "Manual release tag must look like v1.1.0" >&2
              exit 1
            fi
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Create .app bundle
        run: |
          mkdir -p BatteryMonitor.app/Contents/MacOS
          mkdir -p BatteryMonitor.app/Contents/Resources
          mkdir -p BatteryMonitor.app/Contents/Library/LaunchDaemons

          cp "$bin_path/BatteryMonitor" BatteryMonitor.app/Contents/MacOS/BatteryMonitor
          cp "$bin_path/BatteryMonitorPrivilegedHelper" BatteryMonitor.app/Contents/MacOS/BatteryMonitorPrivilegedHelper
          cp SupportFiles/AppIcon.icns BatteryMonitor.app/Contents/Resources/AppIcon.icns
          cp SupportFiles/LaunchDaemons/com.swacktools.batterymonitor.helper.plist \
            BatteryMonitor.app/Contents/Library/LaunchDaemons/com.swacktools.batterymonitor.helper.plist

          cat > BatteryMonitor.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>BatteryMonitor</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIconName</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.swacktools.batterymonitor</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Battery Monitor</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.get_version.outputs.version }}</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSHumanReadableCopyright</key>
            <string>Copyright (c) 2026. All rights reserved.</string>
          </dict>
          </plist>
          EOF

          ls -lh BatteryMonitor.app/Contents/MacOS/BatteryMonitor
          ls -lh BatteryMonitor.app/Contents/MacOS/BatteryMonitorPrivilegedHelper

      - name: Code sign app bundle
        run: |
          SIGN_IDENTITY="Developer ID Application: ${{ secrets.APPLE_TEAM_NAME }} (${{ secrets.APPLE_TEAM_ID }})"

          codesign --force --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" \
            BatteryMonitor.app/Contents/MacOS/BatteryMonitorPrivilegedHelper

          codesign --force --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" \
            BatteryMonitor.app/Contents/MacOS/BatteryMonitor

          codesign --force --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" \
            BatteryMonitor.app

          codesign --verify --strict --deep --verbose=2 BatteryMonitor.app
          codesign -dvv BatteryMonitor.app

      - name: Create DMG installer
        run: |
          mkdir -p dmg_staging
          cp -R BatteryMonitor.app dmg_staging/
          ln -s /Applications dmg_staging/Applications

          hdiutil create \
            -volname "Battery Monitor Installer" \
            -srcfolder dmg_staging \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            BatteryMonitor.dmg

          ls -lh BatteryMonitor.dmg

      - name: Notarize DMG
        run: |
          xcrun notarytool submit BatteryMonitor.dmg \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait

          xcrun stapler staple BatteryMonitor.dmg
          xcrun stapler validate BatteryMonitor.dmg

      - name: Create checksums
        run: |
          shasum -a 256 BatteryMonitor.dmg > BatteryMonitor.dmg.sha256
          cat BatteryMonitor.dmg.sha256

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          ## Battery Monitor v${{ steps.get_version.outputs.version }}

          upgrade for OSx 27

          ### macOS Menu Bar Battery Monitoring Tool

          **Requirements:**
          - macOS 13.0 (Ventura) or later
          - Apple Silicon Mac

          ### Installation
          1. Download \`BatteryMonitor.dmg\`
          2. Open the DMG file
          3. Drag \`BatteryMonitor.app\` to your Applications folder
          4. Launch from Applications or Spotlight
          5. Use the Root Helper toggle to register the privileged thermal helper when needed

          ### Features
          - Menu bar battery percentage and charging status
          - Detailed battery health, cycle, and capacity metrics
          - macOS 26 and 27 battery data layout compatibility
          - General thermals section with battery and privileged component telemetry
          - Root LaunchDaemon helper for CPU/GPU/ANE/DRAM power, thermal pressure, and throttling data
          - USB-C Power Delivery diagnostics
          - Signed and notarized DMG installer

          ### What's Included
          - \`BatteryMonitor.dmg\` - Signed and notarized installer package (${{ steps.get_version.outputs.version }})
          - \`BatteryMonitor.dmg.sha256\` - Checksum for verification
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
          RELEASE_TITLE: Battery Monitor ${{ steps.get_version.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_NOTES_FILE: release-notes.md
        run: |
          assets=(BatteryMonitor.dmg BatteryMonitor.dmg.sha256)
          release_args=(--title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES_FILE" --latest)

          if [[ -n "${RELEASE_TARGET:-}" ]]; then
            release_args+=(--target "$RELEASE_TARGET")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${release_args[@]}"
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            gh release create "$TAG" "${release_args[@]}" "${assets[@]}"
          fi

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain
